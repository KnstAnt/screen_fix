[package]
name = "screen-fix"
version = "0.1.0"
edition = "2024"

[features]
# `dev-log` writes a development `dev.log` into each attempt directory. It is
# on by default only for manual testing: remove it from `default` (or build
# with `--no-default-features`) for production.
default = ["dev-log"]
dev-log = ["screen-fix-core/dev-log"]
elevated-release = []
# Developer-only trusted fixture Save producer (M1-08). Off by default.
fixture-save = []

[dependencies]
screen-fix-core = { path = "../core" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.17.2", default-features = false }
raw-window-handle = "0.6"

[build-dependencies]
embed-resource = "3"
