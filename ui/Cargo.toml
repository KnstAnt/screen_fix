[package]
name = "screen-fix"
version = "0.1.0"
edition = "2024"

[features]
elevated-release = []

[dependencies]
screen-fix-core = { path = "../core" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.17.2", default-features = false }
raw-window-handle = "0.6"

[build-dependencies]
embed-resource = "3"
